services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: femalogy
      POSTGRES_PASSWORD: femalogy
      POSTGRES_DB: femalogy
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U femalogy"]
      interval: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://femalogy:femalogy@db:5432/femalogy
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
